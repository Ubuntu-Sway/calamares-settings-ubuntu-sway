---
modules-search: [ local ]

instances:
- id: before_bootloader_kerncopy
  module: shellprocess
  config: shellprocess_before_bootloader_kerncopy.conf
- id: before_bootloader
  module: contextualprocess
  config: before_bootloader_context.conf
- id: logs
  module: shellprocess
  config: shellprocess_logs.conf
- id: bug-LP#1829805
  module: shellprocess
  config: shellprocess_bug-LP#1829805.conf
- id: add386arch
  module: shellprocess
  config: shellprocess_add386arch.conf
- id: fixconkeys_part1
  module: shellprocess
  config: shellprocess_fixconkeys_part1.conf
- id: fixconkeys_part2
  module: shellprocess
  config: shellprocess_fixconkeys_part2.conf
- id: rmcdrom
  module: shellprocess
  config: shellprocess_rmcdrom.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@before_bootloader_kerncopy
  - automirror
  - shellprocess@fixconkeys_part1
  - shellprocess@fixconkeys_part2
  - dracutlukscfg
  - dracut
  - shellprocess@bug-LP#1829805
  - shellprocess@add386arch
  - contextualprocess@before_bootloader
  - grubcfg
  - bootloader
  - pkgselectprocess
  - shellprocess@rmcdrom
  - shellprocess@logs
  - umount
- show:
  - finished

branding: ubuntusway
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
